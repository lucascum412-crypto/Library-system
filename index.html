<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>圖書館借閱系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    body { font-family: sans-serif; }
  </style>
</head>
<body class="bg-gray-50 text-gray-800">

  <header class="bg-white shadow-sm p-4 flex justify-between items-center">
    <div>
      <h1 class="text-xl font-bold">圖書館系統</h1>
    </div>
    
    <div class="flex items-center gap-4">
      <button onclick="switchTab('active')" class="text-sm font-medium">借閱中</button>
      <button onclick="switchTab('returned')" class="text-sm font-medium">已歸還</button>
      <button onclick="toggleLang()" class="text-sm font-medium">🌐 語言</button>
      
      <button onclick="handleAISummary()" id="aiBtn" class="flex items-center gap-1.5 bg-zinc-900 text-zinc-100 px-3 py-1.5 rounded-full text-xs font-bold hover:bg-zinc-800 transition-colors active:scale-95 border border-zinc-700 disabled:opacity-50">
        <i data-lucide="sparkles" class="w-3.5 h-3.5"></i>
        <span id="aiBtnText">AI 報告</span>
      </button>
    </div>
  </header>

  <main class="max-w-4xl mx-auto p-4 mt-4">
    <section class="bg-white p-4 rounded-lg shadow-sm border border-gray-200 mb-6">
      <form onsubmit="handleFormSubmit(event)" class="flex flex-wrap gap-4 items-end">
        <div class="flex-1 min-w-[150px]">
          <label class="block text-xs text-gray-500 mb-1">書名</label>
          <input type="text" id="bookTitle" required class="w-full border p-2 rounded text-sm">
        </div>
        <div class="w-28">
          <label class="block text-xs text-gray-500 mb-1">班別</label>
          <select id="userClass" required class="w-full border p-2 rounded text-sm bg-white">
            <option value="" disabled selected>請選擇</option>
            </select>
        </div>
        <div class="flex-1 min-w-[150px]">
          <label class="block text-xs text-gray-500 mb-1">讀者名稱</label>
          <input type="text" id="userName" required class="w-full border p-2 rounded text-sm">
        </div>
        <div class="flex-1 min-w-[160px]">
          <label class="block text-xs text-gray-500 mb-1">本地上傳頭像</label>
          <input type="file" id="userAvatar" accept="image/*" class="w-full text-xs text-gray-500 file:mr-2 file:py-1.5 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
        </div>
        <div class="w-36">
          <label class="block text-xs text-gray-500 mb-1">借閱日期</label>
          <input type="date" id="borrowDate" required class="w-full border p-2 rounded text-sm">
        </div>
        <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded text-sm font-bold hover:bg-blue-700 h-[38px]">新增紀錄</button>
      </form>
    </section>

    <section id="recordList" class="grid gap-4">
      </section>
  </main>

  <script>
    // ==========================================
    // 全局變數與基礎設定
    // ==========================================
    const APPS_SCRIPT_URL = "YOUR_APPS_SCRIPT_URL_PASTE_HERE";
    let currentTab = 'active';
    let currentLang = 'zh';

    const translations = {
      zh: { confirmReturn: "確定要歸還這本書嗎？", returned: "已歸還", returnBook: "歸還" },
      en: { confirmReturn: "Are you sure you want to return this book?", returned: "Returned", returnBook: "Return" }
    };

    // ==========================================
    // 用 GET 重新實作 fetchRecordsFromSheet (含新欄位標準化)
    // ==========================================
    function normalizeRecord(record) {
      return {
        id: record.id || record.ID || "",
        createdAt: record.createdAt || record.CreatedAt || "",
        userId: record.userId || record.UserId || "",
        userName: record.userName || record.UserName || "未知讀者",
        userClass: record.userClass || record.UserClass || "",      // 新增班別欄位映射
        userAvatar: record.userAvatar || record.UserAvatar || "",    // 新增頭像欄位映射
        status: record.status || record.Status || "active",
        bookTitle: record.bookTitle || record.BookTitle || "未知名稱",
        borrowDate: record.borrowDate || record.BorrowDate || "",
        returnDate: record.returnDate || record.ReturnDate || "",
        returnedAt: record.returnedAt || record.ReturnedAt || ""
      };
    }

    async function fetchRecordsFromSheet() {
      if (APPS_SCRIPT_URL.includes("PASTE")) return null;
      try {
        const res = await fetch(APPS_SCRIPT_URL);
        const data = await res.json();
        return Array.isArray(data.records) ? data.records.map(normalizeRecord) : null;
      } catch (e) {
        console.warn("從 Sheet 讀取失敗", e);
        return null;
      }
    }

    // ==========================================
    // 將 loadData 改為從 Sheet 讀回，localStorage 做 fallback
    // ==========================================
    async function loadData() {
      const remote = await fetchRecordsFromSheet();
      if (remote) {
        localStorage.setItem("records", JSON.stringify(remote));
        return remote;
      }
      const data = localStorage.getItem("records");
      return data ? JSON.parse(data) : [];
    }

    // 更新 saveData：本地即時 render 避免畫面閃爍與蓋過新資料
    async function saveData(newRecord) {
      const records = await loadData();
      records.unshift(newRecord); 
      localStorage.setItem("records", JSON.stringify(records));
      syncToSheet({ action: "create", record: newRecord });
      await renderList(records);
    }

    // 更新 returnBook：更新狀態後直接用最新 records 進行 render
    async function returnBook(id) {
      const t = translations[currentLang];
      if (!confirm(t.confirmReturn)) return;
      
      const records = await loadData();
      const index = records.findIndex(r => r.id === id);
      if (index !== -1) {
        const returnedAt = new Date().toISOString();
        records[index].status = "returned";
        records[index].returnedAt = returnedAt;
        localStorage.setItem("records", JSON.stringify(records));
        syncToSheet({ action: "update", id: id, changes: { status: "returned", returnedAt: returnedAt } });
        await renderList(records);
      }
    }

    // 更新 renderList：融入頭像與班別，並支援 recordsOverride 阻斷遠端延遲
    async function renderList(recordsOverride) {
      const records = recordsOverride || await loadData();
      const container = document.getElementById("recordList");
      if (!container) return;
      
      container.innerHTML = "";
      const t = translations[currentLang];
      const filtered = records.filter(r => r.status === currentTab);

      filtered.forEach(r => {
        const card = document.createElement('div');
        card.className = "p-4 bg-white border border-gray-200 rounded-lg flex justify-between items-center shadow-sm";
        
        // 1. 本地頭像顯示邏輯（如果有 Base64 數據則顯示，否則展示 Lucide 預設用戶圖標）
        const avatarHTML = r.userAvatar 
          ? `<img src="${r.userAvatar}" class="w-10 h-10 rounded-full object-cover border border-gray-200">` 
          : `<div class="w-10 h-10 rounded-full bg-gray-100 flex items-center justify-center text-gray-400 border border-gray-200"><i data-lucide="user" class="w-5 h-5"></i></div>`;

        // 2. 班別附加顯示字串
        const classStr = r.userClass ? ` (${r.userClass})` : "";

        card.innerHTML = `
          <div class="flex items-center gap-3">
            ${avatarHTML}
            <div>
              <h3 class="font-bold text-gray-800">${r.bookTitle}</h3>
              <p class="text-xs text-gray-500 mt-1">讀者: ${r.userName}${classStr} | 借出: ${r.borrowDate}</p>
            </div>
          </div>
          <div>
            ${r.status === 'active' 
              ? `<button onclick="returnBook('${r.id}')" class="bg-red-50 text-red-600 px-3 py-1.5 rounded text-xs font-semibold border border-red-200 hover:bg-red-100">${t.returnBook}</button>`
              : `<span class="text-xs font-bold text-green-600 bg-green-50 px-2 py-1 rounded">${t.returned}</span>`
            }
          </div>
        `;
        container.appendChild(card);
      });

      if (typeof lucide !== 'undefined') lucide.createIcons();
    }

    // ==========================================
    // 圖片壓縮工具：限制最大 100x100 避開 localStorage 的 5MB 上限與優化雲端傳輸
    // ==========================================
    function compressImageToBase64(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement("canvas");
            const maxSize = 100;
            let width = img.width;
            let height = img.height;
            
            if (width > height && width > maxSize) {
              height *= maxSize / width; width = maxSize;
            } else if (height > maxSize) {
              width *= maxSize / height; height = maxSize;
            }
            
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL("image/jpeg", 0.7)); // 轉為 JPEG 格式，品質 70%
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    // ==========================================
    // 班別清單自動生成：P1-P6 有 A-E 班；S1-S6 有 A-F 班
    // ==========================================
    function generateClassOptions() {
      const select = document.getElementById('userClass');
      if (!select) return;
      
      // 生成 P1-P6 (A-E)
      for (let i = 1; i <= 6; i++) {
        for (let j = 0; j < 5; j++) {
          const cls = `P${i}${String.fromCharCode(65 + j)}`;
          select.add(new Option(cls, cls));
        }
      }
      
      // 生成 S1-S6 (A-F)
      for (let i = 1; i <= 6; i++) {
        for (let j = 0; j < 6; j++) {
          const cls = `S${i}${String.fromCharCode(65 + j)}`;
          select.add(new Option(cls, cls));
        }
      }
    }

    // ==========================================
    // 既有功能整合與呼叫優化
    // ==========================================
    async function handleFormSubmit(e) {
      e.preventDefault();
      
      // 讀取上傳的本地頭像檔案
      const fileInput = document.getElementById('userAvatar');
      let avatarData = "";
      if (fileInput && fileInput.files && fileInput.files[0]) {
        avatarData = await compressImageToBase64(fileInput.files[0]);
      }

      const newRecord = {
        id: "REC-" + Date.now(),
        createdAt: new Date().toISOString(),
        userId: "local-user", 
        userName: document.getElementById('userName').value,
        userClass: document.getElementById('userClass').value, // 寫入班別
        userAvatar: avatarData,                               // 寫入 Base64 頭像
        status: "active",
        bookTitle: document.getElementById('bookTitle').value,
        borrowDate: document.getElementById('borrowDate').value,
        returnDate: "",
        returnedAt: ""
      };
      
      await saveData(newRecord);
      e.target.reset();
      document.getElementById("borrowDate").value = new Date().toISOString().split('T')[0];
    }

    async function switchTab(tab) {
      currentTab = tab;
      await renderList();
    }

    async function toggleLang() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      await renderList();
    }

    function syncToSheet(payload) {
      if (APPS_SCRIPT_URL.includes("PASTE")) return;
      fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        headers: { "Content-Type": "text/plain" },
        body: JSON.stringify(payload)
      }).catch(e => console.warn("Sync failed:", e));
    }

    // ==========================================
    // 簡化後的 window.onload (新增自動生成班別清單)
    // ==========================================
    window.onload = async () => {
      document.getElementById("borrowDate").value = new Date().toISOString().split('T')[0];
      generateClassOptions(); // 初始化班別下拉選單
      await renderList();
      if (typeof lucide !== 'undefined') lucide.createIcons();
    };

    // ==========================================
    // AI 借閱報告功能
    // ==========================================
    async function askAI(userPrompt) {
      if (APPS_SCRIPT_URL.includes("PASTE")) return "請先設定 APPS_SCRIPT_URL";
      try {
        const res = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain" },
          body: JSON.stringify({ action: "askAI", prompt: userPrompt })
        });
        const data = await res.json();
        return data.result || data.error || "AI 沒有回應";
      } catch (e) {
        return "連線錯誤：" + e.message;
      }
    }

    async function handleAISummary() {
      const btn = document.getElementById('aiBtn');
      const text = document.getElementById('aiBtnText');
      btn.disabled = true;
      text.textContent = '計算中...';
      
      try {
        const records = await loadData();
        if (records.length === 0) { 
          alert('未有借閱紀錄資料可以產生報告'); 
          return; 
        }
        
        // 報告數據中加入班別資訊，方便 AI 做更精準的讀者群規律分析
        const summaryInput = records.slice(0, 30).map(r =>
          `[${r.status === 'active' ? '借閱中' : '已歸還'}] 讀者: ${r.userName} (${r.userClass || '未註明班別'}), 書名: ${r.bookTitle}`
        ).join('\n');
        
        const prompt = '以下是圖書館系統最新的借閱紀錄資料。請用繁體中文，用 3-5 句概括目前最受歡迎的書籍種類或讀者群、目前書籍過期未還或借閱中的狀況，以及有無明顯的借閱行為規律或趨勢:\n\n' + summaryInput;
        
        const result = await askAI(prompt);
        alert(result);
      } catch (e) {
        alert('AI 出錯：' + e.message);
      } finally {
        btn.disabled = false;
        text.textContent = 'AI 報告';
      }
    }
  </script>
</body>
</html>
