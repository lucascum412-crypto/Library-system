<html lang="zh-TW">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=JetBrains+Mono&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        :root {
            --bg: #E4E3E0;
            --ink: #141414;
        }
        body {
            background-color: var(--bg);
            color: var(--ink);
            font-family: 'Inter', sans-serif;
        }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .font-serif-italic { font-family: 'Playfair Display', serif; font-style: italic; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--ink); border-radius: 10px; }
        .form-input {
            width: 100%;
            background: transparent;
            border-bottom: 1px solid var(--ink);
            padding: 8px 0;
            outline: none;
            transition: border-opacity 0.2s;
        }
        .form-input:focus { border-bottom-color: rgba(20, 20, 20, 0.5); }
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
        .card-enter { animation: slideUp 0.4s ease-out forwards; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(20, 20, 20, 0.85);
            z-index: 300;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            padding: 24px;
        }
    </style>
</head>
<body class="selection:bg-[#141414] selection:text-[#E4E3E0]">
    
    <div id="modal-help" class="modal-overlay hidden">
        <div class="w-full max-w-lg bg-[#E4E3E0] p-10 rounded-sm shadow-2xl space-y-6">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-2xl font-bold uppercase tracking-widest">使用說明書</h2>
                <button onclick="closeModal('modal-help')" class="p-2 hover:bg-[#141414] hover:text-[#E4E3E0] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div class="space-y-4 font-serif-italic opacity-80 text-lg leading-relaxed">
                <p>1. 首次進入系統請完整填寫個人資訊登記。</p>
                <p>2. 在「借書登記」頁面可以點擊左側快速引入推薦書籍，或點擊按鈕手動輸入新登記。</p>
                <p>3. 點擊右上角頭像可以進入個人檔案修改欄位（如 GAS 端點 URL）。</p>
                <p>4. 在「還書管理」分頁中，您可以隨時對名下未歸還的書籍辦理退還手續。</p>
            </div>
            <button onclick="closeModal('modal-help')" class="w-full bg-[#141414] text-[#E4E3E0] py-4 text-xs font-bold uppercase tracking-widest">關閉</button>
        </div>
    </div>

    <div id="modal-profile" class="modal-overlay hidden">
        <div class="w-full max-w-xl bg-[#E4E3E0] p-8 rounded-sm shadow-2xl space-y-8 max-h-[90vh] overflow-y-auto">
            <div class="flex items-center justify-between border-b border-[#141414] border-opacity-10 pb-4">
                <h2 class="text-2xl font-bold uppercase tracking-widest">個人資料管理</h2>
                <button onclick="closeModal('modal-profile')" class="p-2 hover:bg-[#141414] hover:text-[#E4E3E0] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                <form onsubmit="handleUpdateProfile(event)" class="space-y-6">
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">姓名</label>
                        <input type="text" id="profile-name" class="form-input text-lg font-bold" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">學號 / 編號</label>
                        <input type="text" id="profile-id" class="form-input text-lg font-mono" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-mono uppercase opacity-50">年級</label>
                            <select id="profile-grade" class="form-input text-sm h-[40px] bg-transparent" onchange="updateClassOptions('profile')" required>
                                <optgroup label="Primary (P)">
                                    <option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option>
                                    <option value="P4">P4</option><option value="P5">P5</option><option value="P6">P6</option>
                                </optgroup>
                                <optgroup label="Secondary (S)">
                                    <option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option>
                                    <option value="S4">S4</option><option value="S5">S5</option><option value="S6">S6</option>
                                </optgroup>
                            </select>
                        </div>
                        <div class="space-y-1">
                            <label class="text-[10px] font-mono uppercase opacity-50">班別</label>
                            <select id="profile-class" class="form-input text-sm h-[40px] bg-transparent" required></select>
                        </div>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">Google Sheets API URL (GAS)</label>
                        <input type="url" id="profile-gas-url" class="form-input text-[10px] font-mono" placeholder="https://script.google.com/macros/s/.../exec">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">頭像網址</label>
                        <input type="url" id="profile-avatar" class="form-input text-sm">
                    </div>
                    <button type="submit" class="w-full bg-[#141414] text-[#E4E3E0] py-4 text-xs font-bold uppercase tracking-widest hover:opacity-90 transition-all">儲存修改</button>
                </form>

                <div class="space-y-8">
                    <div class="space-y-4">
                        <label class="text-[10px] font-mono uppercase opacity-50">語言設定 / Language</label>
                        <div class="flex flex-col gap-2">
                            <button onclick="alert('語系切換成功')" class="w-full border border-[#141414] py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#141414] hover:text-[#E4E3E0] transition-all">繁體中文</button>
                            <button onclick="alert('Language changed to English')" class="w-full border border-[#141414] py-3 text-xs font-bold uppercase tracking-widest hover:bg-[#141414] hover:text-[#E4E3E0] transition-all">English</button>
                        </div>
                    </div>
                    <div class="h-[1px] bg-[#141414] opacity-10"></div>
                    <div class="space-y-4">
                        <button onclick="exportUserData()" class="w-full border border-[#141414] border-dashed py-3 text-[10px] font-mono uppercase tracking-widest hover:bg-[#141414] hover:text-[#E4E3E0] transition-all flex items-center justify-center gap-2">
                            <span>匯出用戶檔案 (JSON)</span>
                        </button>
                        <button onclick="handleLogout()" class="w-full bg-red-600 text-white py-4 text-xs font-bold uppercase tracking-widest hover:opacity-90 transition-all flex items-center justify-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
                            <span>登出並清除本地快取</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-ai-report" class="modal-overlay hidden">
        <div class="w-full max-w-2xl bg-[#E4E3E0] p-10 rounded-sm shadow-2xl space-y-6 max-h-[85vh] flex flex-col relative overflow-hidden">
            <div class="flex items-center justify-between border-b border-[#141414] border-opacity-10 pb-4 shrink-0">
                <div class="flex items-center gap-3">
                    <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-[#141414] hidden" id="ai-loading-icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                    <h2 class="text-2xl font-bold uppercase tracking-widest">AI 智能閱讀分析</h2>
                </div>
                <button onclick="closeModal('modal-ai-report')" class="p-2 hover:bg-[#141414] hover:text-[#E4E3E0] transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>
            <div id="ai-report-content" class="flex-1 overflow-y-auto space-y-4 font-serif-italic opacity-90 text-md leading-relaxed pr-2"></div>
            <button onclick="closeModal('modal-ai-report')" class="w-full bg-[#141414] text-[#E4E3E0] py-4 text-xs font-bold uppercase tracking-widest shrink-0 mt-4">關閉報告</button>
        </div>
    </div>

    <div id="login-overlay" class="fixed inset-0 bg-[#141414] z-[200] flex items-center justify-center p-6 backdrop-blur-md">
        <div class="w-full max-w-sm bg-[#E4E3E0] p-10 rounded-sm shadow-2xl space-y-8 animate-in fade-in zoom-in duration-300">
            <div class="text-center space-y-2">
                <div class="flex justify-center mb-4">
                    <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="opacity-20"><path d="m16 6 4 14"/><path d="M12 6v14"/><path d="M8 8v12"/><path d="M4 4v16"/><path d="M12 2h10"/><path d="m16 2-4 4 4 4"/></svg>
                </div>
                <h2 class="text-2xl font-bold uppercase tracking-widest">圖書館系統登錄</h2>
                <p class="font-serif-italic opacity-60 text-sm">請填寫您的資訊以初始化系統帳戶</p>
            </div>
            
            <form onsubmit="handleCustomLogin(event)" class="space-y-6">
                <div class="space-y-4">
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">姓名</label>
                        <input type="text" id="login-name" class="form-input text-lg" placeholder="請輸入真實姓名" required>
                    </div>
                    <div class="space-y-1">
                        <label class="text-[10px] font-mono uppercase opacity-50">學號 / 編號</label>
                        <input type="text" id="login-id" class="form-input text-lg" placeholder="SXXXXX" required>
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div class="space-y-1">
                            <label class="text-[10px] font-mono uppercase opacity-50">年級</label>
                            <select id="login-grade" class="form-input text-sm h-[40px] bg-transparent" onchange="updateClassOptions('login')" required>
                                <option value="" disabled selected>請選擇</option>
                                <optgroup label="Primary (P)">
                                    <option value="P1">P1</option><option value="P2">P2</option><option value="P3">P3</option>
                                    <option value="P4">P4</option><option value="P5">P5</option><option value="P6">P6</option>
                                </optgroup>
                                <optgroup label="Secondary (S)">
                                    <option value="S1">S1</option><option value="S2">S2</option><option value="S3">S3</option>
                                    <option value="S4">S4</option><option value="S5">S5</option><option value="S6">S6</option>
                                </optgroup>
                            </select>
